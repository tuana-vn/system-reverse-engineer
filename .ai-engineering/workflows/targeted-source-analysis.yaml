version: '4.0'
name: targeted-source-analysis
description: Source-backed analysis of one concrete runtime behavior, flow, field, integration, configuration, or
  persistence question without forcing full baseline reconstruction.
runner_skill: run-engineering-workflow
state_path: docs/reverse-engineering/workflows/{{run_id}}.yaml
inputs:
  required:
  - scope
  - scope_slug
  - analysis_question
  optional:
  - requirement_path
  - source_anchor
  - analysis_mode
  defaults:
    artifact_root: docs/reverse-engineering
    analysis_mode: runtime
steps:
  targeted_analysis:
    prompt: .ai-engineering/prompts/targeted-source-analysis/01-targeted-analysis.md
    skills:
    - resume-reverse-engineering
    - runtime-flow-analysis
    - claim-verification-and-promotion
    output: '{{artifact_root}}/analysis/{{scope_slug}}_targeted_analysis.md'
    statuses:
      TARGETED_ANALYSIS_COMPLETE: DONE
      TARGETED_ANALYSIS_PARTIAL: resolve_unknowns
      TARGETED_ANALYSIS_BLOCKED: resolve_unknowns
  resolve_unknowns:
    prompt: .ai-engineering/prompts/common/resolve-high-impact-unknowns.md
    skills:
    - resolve-high-impact-unknowns
    retry_step: targeted_analysis
    on_success: targeted_analysis
    inputs:
      blocking_artifact: '{{blocking_artifact}}'
      blocking_qids: '{{blocking_qids}}'
      retry_step: '{{blocking_retry_step}}'
execution:
  execution_mode: resume
  ignore_previous_completion: false
